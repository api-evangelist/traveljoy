name: TravelJoy
description: 'TravelJoy is software for travel advisors and agencies — a client CRM, itinerary
  and proposal builder, secure payment collection, forms and questionnaires, and automated
  client communication combined in one platform. Travel professionals use it to manage
  trips, capture and nurture leads, send branded proposals, gather traveler details, and
  collect payments. Surfaced as a portfolio company of GV (Google Ventures) and added to
  the API Evangelist network. As of this enrichment pass TravelJoy publishes no public API,
  developer portal, or SDK program; this profile tracks its identity and public web
  properties for discovery.'
